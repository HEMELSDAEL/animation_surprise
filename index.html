<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#050b1b">
        <meta name="description" content="Une petite constellation de pensées positives.">
        <title>Quelques étoiles pour toi</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="universe">
            <canvas id="sky" aria-hidden="true"></canvas>
            <div class="nebula nebula--one" aria-hidden="true"></div>
            <div class="nebula nebula--two" aria-hidden="true"></div>

            <header class="intro">
                <p class="eyebrow"><span>✦</span> UNE PETITE PAUSE DANS L’UNIVERS</p>
                <h1>Quelques étoiles<br><span>pour toi</span></h1>
                <p class="intro-copy">
                    Prends ton temps, regarde le ciel<br>
                    et choisis une étoile.
                </p>
                <div class="scroll-cue" aria-hidden="true"><span></span></div>
            </header>

             <section class="constellation" aria-label="Constellation interactive">
                <svg class="constellation-lines" viewBox="0 0 1000 700"
                    preserveAspectRatio="none" aria-hidden="true">
                    <path d="M135 175 L300 265 L480 145 L645 280 L835 165"/>
                    <path d="M300 265 L375 465 L645 280 L725 490"/>
                </svg>

                <div class="star-field">
                    <button class="star-node star-node--1" data-star="0"
                        aria-label="Découvrir l'étoile de la gentillesse">
                        <span class="star-core"></span>
                        <span class="star-label">Gentillesse</span>
                    </button>

                    <button class="star-node star-node--2" data-star="1"
                        aria-label="Découvrir l'étoile des petites attentions">
                        <span class="star-core"></span>
                        <span class="star-label">Petites attentions</span>
                    </button>

                    <button class="star-node star-node--3" data-star="2"
                        aria-label="Découvrir l'étoile de la pause">
                        <span class="star-core"></span>
                        <span class="star-label">Faire une pause</span>
                    </button>

                    <button class="star-node star-node--4" data-star="3"
                        aria-label="Découvrir l'étoile des petits bonheurs">
                        <span class="star-core"></span>
                        <span class="star-label">Petits bonheurs</span>
                    </button>

                    <button class="star-node star-node--5" data-star="4"
                        aria-label="Découvrir l'étoile des fleurs">
                        <span class="star-core"></span>
                        <span class="star-label">Une fleur 🌼</span>
                    </button>

                    <button class="star-node star-node--6" data-star="5"
                        aria-label="Découvrir l'étoile de la soirée">
                        <span class="star-core"></span>
                        <span class="star-label">Pour ce soir</span>
                    </button>
                </div>

                <p class="constellation-hint">
                    <span class="hint-dot"></span>
                    Touche une étoile pour découvrir son message
                </p>
            </section>

            <footer class="footer-note">
                Fait de quelques pixels et d’une pensée positive <span>✦</span>
            </footer>

            <div class="modal" id="messageModal" role="dialog"
                aria-modal="true" aria-labelledby="messageTitle"
                aria-describedby="messageText" hidden>
                <button class="modal-backdrop" data-close
                    aria-label="Fermer le message"></button>

                <article class="message-card">
                    <button class="close-button" data-close
                        aria-label="Fermer">×</button>
                    
                    <div class="message-symbol" id="messageSymbol" aria-hidden="true">✦</div>
                    <p class="message-kicker">UNE PETITE PENSÉE</p>
                    <h2 id="messageTitle">Pour toi</h2>
                    <p class="message-text" id="messageText"></p>

                    <div class="message-divider">
                        <span></span><i>✦</i><span></span>
                    </div>

                    <button class="back-button" data-close>
                        Retourner aux étoiles
                    </button>
                </article>
            </div>
        </main>
    </body>
</html>
